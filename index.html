<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Jelly Drop</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      /* Phones taller than the game leave space above and below it: fill that space with the
         game's own sky (the colours at its top and bottom edges) and a few stars, so the game
         seems to carry on to the edges of the screen instead of sitting between dark bars. */
      html {
        background-color: #160f3f;
        background-image:
          radial-gradient(1.3px 1.3px at 22% 31%, rgba(255, 255, 255, 0.75), transparent),
          radial-gradient(1px 1px at 71% 63%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(1.5px 1.5px at 46% 82%, rgba(255, 255, 255, 0.6), transparent),
          radial-gradient(1px 1px at 86% 14%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1.2px 1.2px at 9% 71%, rgba(255, 255, 255, 0.45), transparent),
          linear-gradient(#1b1549, #130f37);
        background-size: 173px 173px, 229px 229px, 263px 263px, 151px 151px, 197px 197px, 100% 100%;
      }
      body { background: transparent; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
